<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高値の奪還率｜AI・半導体株と主要指数</title>
  <meta name="description" content="AI・半導体株と主要指数が、基準期間の高値や年初来高値の何%まで戻っているかを一覧で比較します。">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div>
        <p class="eyebrow" id="eyebrow">&nbsp;</p>
        <h1 id="title">高値の奪還率</h1>
        <p class="subtitle" id="subtitle">AI・半導体株と主要指数</p>
      </div>
      <div class="asof">
        <span class="asof-label">比較日</span>
        <strong id="asof">—</strong>
        <span class="asof-note">各市場の現地日付・終値</span>
      </div>
    </header>

    <div class="dummy-banner" id="dummy-banner" hidden>
      ⚠ 表示中の株価は<strong>ダミーデータ</strong>です。実際の株価ではありません。
    </div>

    <nav class="tabs" role="tablist" aria-label="比較する高値">
      <button role="tab" id="tab-ref" data-mode="ref" aria-selected="true">期間高値の奪還率</button>
      <button role="tab" id="tab-ytd" data-mode="ytd" aria-selected="false">年初来高値の奪還率</button>
    </nav>

    <section class="formula" id="formula" aria-live="polite"></section>

    <section>
      <div class="section-head">
        <h2>主要指数の年初来パフォーマンス</h2>
        <span class="muted small">年初の終値 = 100</span>
      </div>
      <p class="muted small" id="chart-note"></p>
      <div class="card chart-card">
        <div class="chart-wrap"><canvas id="index-chart" aria-label="主要指数の年初来推移チャート" role="img"></canvas></div>
      </div>
      <p class="legend-title" id="chart-legend-title"></p>
      <div class="legend" id="chart-legend" role="group" aria-label="指数の表示切り替え"></div>
    </section>

    <section>
      <div class="section-head">
        <div>
          <h2 id="index-bars-title">主要指数の現在位置</h2>
          <p class="muted small" id="index-bars-note"></p>
        </div>
      </div>
      <div class="card bars" id="index-bars"></div>
      <p class="muted small hint">指数名を押すと、終値・高値・推移を確認できます。</p>
    </section>

    <section>
      <div class="section-head">
        <h2>個別株の現在位置</h2>
        <span class="muted small" id="stock-total"></span>
      </div>
      <div class="summary" id="status-summary"></div>
      <div class="toolbar">
        <input type="search" id="search" placeholder="銘柄名・コードで検索（例：NVDA、東京エレクトロン）" aria-label="銘柄を検索">
        <div class="tools">
          <button type="button" class="ghost" id="expand-all">すべて展開</button>
          <button type="button" class="ghost" id="collapse-all">すべて閉じる</button>
        </div>
      </div>
      <p class="muted small hint">銘柄名を押すと、価格と突破履歴を確認できます。</p>
      <div id="stock-groups"></div>
      <p class="empty" id="no-results" hidden>条件に合う銘柄がありません。</p>
    </section>

    <section class="card methodology">
      <h2>比較基準とデータ</h2>
      <div id="method"></div>
    </section>

    <footer class="footer">
      <p id="generated"></p>
      <p>このページは情報提供のみを目的としており、特定銘柄の売買を推奨するものではありません。</p>
    </footer>
  </div>
</body>
</html>
